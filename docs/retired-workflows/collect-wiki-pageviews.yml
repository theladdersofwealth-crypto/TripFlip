name: 장소 위키 조회수

# 장소별 위키백과 조회수(최근 12개월). 매달 2일 자동 + 수동 실행. 결과는 data 브랜치 wiki-pageviews/에만 둔다.
on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-wiki-pageviews.mjs store/wiki-pageviews
      - name: 결과 커밋
        working-directory: store
        run: |
          git config user.name "tripflip-bot"
          git config user.email "tripflip-bot@users.noreply.github.com"
          git add wiki-pageviews
          git diff --cached --quiet || git commit -m "위키 조회수 $(date -u +%F)"
          git pull --rebase
          git push
