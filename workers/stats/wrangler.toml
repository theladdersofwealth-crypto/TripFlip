# 관리자 통계 전용 Worker (무료 플랜). 앱이 보내는 익명 이벤트를 Durable Object(SQLite)에 모은다.
# 저장: 기기별 무작위 번호(앱이 만든 것)·단계·권역·날짜(KST)만. 이름·IP·위치 저장 안 함.
# 비밀값: ADMIN_KEY (관리자 페이지 비밀번호) — wrangler secret put ADMIN_KEY
name = "tripflip-stats"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]

# 관리자 통계(/stats)·회원 이용 기록(/users)에서 뺄 회원 닉네임(쉼표로 여러 명). 운영자 본인 테스트 계정 등.
# 이 회원이 로그인했던 기기의 방문 기록도 함께 빠진다. 기록 자체는 지우지 않으므로 여기서 빼면 다시 보인다.
[vars]
HIDE_NICKS = "너만은잡는다"
