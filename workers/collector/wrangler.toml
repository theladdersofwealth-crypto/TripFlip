# 가격 수집 전용 Worker (무료 플랜 안에서만). 앱 Worker "tripflip"과 분리.
name = "tripflip-collector"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 무료 플랜: 크론 최대 5개, 호출당 외부 요청 50회 → 숙소는 5분마다 40건씩 나눠 수집
[triggers]
crons = [
  "0 0,6,12,18 * * *", # 항공권 (09·15·21·03시 KST)
  "*/5 0-7 * * *",     # 숙소 (09:30 KST부터 5분 간격 묶음, 약 67묶음 ≈ 5.5시간)
  "*/5 * 2 * *"        # 위키 조회수 (매월 2일, 3,839건을 86묶음)
]

[[kv_namespaces]]
binding = "DATA"
id = "70e0afbcfa204c968aafabfe648d2b10"
