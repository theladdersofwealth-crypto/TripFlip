name: 숙소 가격 수집

# 숙소 데이터도 앱 배포와 분리하려고 data 브랜치에만 쌓는다.
on:
  schedule:
    - cron: "30 0 * * *" # 매일 09:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 숙소 목록 API(/api/list)는 2026-11-04부터 Xotelo 쪽 고장 → 이전 정상 목록의 숙소별 실제 가격(/api/rates)을 모은다.
      # 목록 수집(scripts/collect-hotel-prices.mjs)은 Xotelo가 복구되면 다시 켠다.
      - name: 숙소별 가격 수집 (정상이 아니면 실패로 표시)
        id: collect
        run: node scripts/collect-hotel-rates.mjs store/hotels store/hotel-rates
      - name: 결과 커밋 (실패해도 진단 기록은 남김)
        if: always()
        working-directory: store
        run: |
          git config user.name "tripflip-bot"
          git config user.email "tripflip-bot@users.noreply.github.com"
          git add hotel-rates
          git diff --cached --quiet || git commit -m "숙소별 가격 수집 $(date -u +%F)"
          git pull --rebase
          git push
